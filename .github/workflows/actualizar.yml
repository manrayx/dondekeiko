name: Actualizar titulares

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (GitHub puede demorar unos minutos)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:                       # se ejecuta también al cambiar el código o la configuración
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update.py
      - name: Guardar cambios
        run: |
          if git diff --quiet public/data.json; then
            echo "Sin titulares nuevos."
            exit 0
          fi
          git config user.name "donde-esta-keiko-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git commit -m "Actualiza titulares"
          git push
