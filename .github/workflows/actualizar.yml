name: Actualizar titulares

# Cada ejecución actualiza los datos y, al terminar, espera 20 minutos y lanza la siguiente.
# Así el sitio se mantiene al día aunque la programación de GitHub se retrase.
# La programación (cron) queda como respaldo para reanudar la cadena si alguna vez se corta.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/update.py
      - name: Guardar cambios
        run: |
          if git diff --quiet public/data.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "donde-esta-keiko-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git commit -m "Actualiza titulares"
          git push || (git pull --rebase -X theirs && git push)

  siguiente:
    needs: actualizar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Esperar y lanzar la siguiente actualización
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1200
          gh workflow run actualizar.yml -R "$GITHUB_REPOSITORY" --ref main
